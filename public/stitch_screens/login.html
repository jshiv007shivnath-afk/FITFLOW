<script>
  // Micro-interaction logic
  const toggleBtn = document.getElementById('togglePasswordBtn');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');
  const rememberToggle = document.getElementById('rememberToggle');
  const checkIcon = document.getElementById('checkIcon');

  let isPasswordVisible = false;
  let isRemembered = true;

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      isPasswordVisible = !isPasswordVisible;
      passwordInput.type = isPasswordVisible ? 'text' : 'password';
      eyeIcon.textContent = isPasswordVisible ? 'visibility_off' : 'visibility';
    });
  }

  if (rememberToggle && checkIcon) {
    rememberToggle.addEventListener('click', () => {
      isRemembered = !isRemembered;
      rememberToggle.setAttribute('aria-checked', isRemembered ? 'true' : 'false');
      if (isRemembered) {
        rememberToggle.classList.remove('bg-surface-secondary');
        rememberToggle.classList.add('bg-primary-container');
        checkIcon.classList.remove('opacity-0');
        checkIcon.classList.add('opacity-100');
      } else {
        rememberToggle.classList.remove('bg-primary-container');
        rememberToggle.classList.add('bg-surface-secondary');
        checkIcon.classList.remove('opacity-100');
        checkIcon.classList.add('opacity-0');
      }
    });
    // Set initial style
    rememberToggle.classList.add('bg-primary-container');
  }

  function handleLogin() {
    const btn = document.getElementById('submitBtn');
    if (!btn) return;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Signing In...</span>';
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Welcome Alexa!</span>';
      btn.classList.add('bg-exercise-mint');
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
        btn.classList.remove('bg-exercise-mint');
      }, 1500);
    }, 1000);
  }
</script></main>
